name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout PaintingMod source dependency
        uses: actions/checkout@v4
        with:
          repository: LSM-Modding-Team/PaintingMod
          ref: 0c6ccb952e548384d0a0b0c9f12a9acf91d45221
          path: .composite/PaintingMod
          persist-credentials: false

      - name: Checkout LSMcore source dependency
        uses: actions/checkout@v4
        with:
          repository: LSM-Modding-Team/LSMcore
          ref: e78829f342580c4b13bd38735a930bfda00ba8f5
          path: .composite/LSMcore
          persist-credentials: false

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install resource preparation dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and check mod
        run: bash gradlew build --no-daemon --max-workers=4 -Ppaintingmod_dir=.composite/PaintingMod -Plsmcore_dir=.composite/LSMcore

      - name: Verify packaged Mixin configurations
        run: python tools/check_mixin_configs.py --jar build/libs/lsmmod-*.jar

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: lsmmod-${{ github.sha }}
          path: build/libs/lsmmod-*.jar
          if-no-files-found: error
