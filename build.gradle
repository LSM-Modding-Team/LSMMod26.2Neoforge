plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

def resourceModuleNames = ['awnings', 'backpacks', 'balls', 'books_notebooks_and_folders', 'building_blocks', 'chairs', 'facilities', 'lighting', 'lockers_and_storage', 'music_discs', 'musical_instruments', 'npcs', 'painting_and_editable_blocks', 'school_supplies', 'shelving', 'slopes', 'special_blocks', 'tables_and_desks', 'technology', 'uniforms', 'wall_blocks', 'windows_and_enclosures']

sourceSets.main.resources {
    // Include resources generated by data generators.
    setSrcDirs([layout.buildDirectory.dir('generated/optimizedModelGraph'),
                layout.buildDirectory.dir('generated/nonModelResources')])

    // Exclude common development only resources from finalized outputs
    exclude(".lsmmod-optimized-resources")
    exclude("lsmmod_model_optimization.json")
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository { maven { name = 'Rinku'; url = 'https://keksuccino.github.io/maven/' } }
        filter { includeGroup 'de.keksuccino' }
    }
    exclusiveContent {
        forRepository { maven { name = 'CurseMaven'; url = 'https://www.cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            resourceModuleNames.each { module ->
                programArguments.addAll '--existing', file("src/main/resources/${module}").getAbsolutePath()
            }
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Dev convenience: `./gradlew runClient` launches the game straight from the sources (no jar, no mods folder).
// Before it starts, copy our default options.txt into run/ if run/ has none yet.
// NOTE: the name 'prepareClientRun' is TAKEN by the NeoForge moddev plugin, so ours is 'applyClientOptions'.
// To apply a changed tools/run-defaults/options.txt, delete run/options.txt once.
tasks.register('applyClientOptions') {
    // The configuration cache forbids calling project methods such as file() inside doLast,
    // so the two File objects are resolved here (configuration time) and only captured below.
    def source = file('tools/run-defaults/options.txt')
    def target = file('run/options.txt')
    doLast {
        if (source.exists() && !target.exists()) {
            target.parentFile.mkdirs()
            target.bytes = source.bytes
        }
    }
}
// Lazy lookup by name, so it still works whatever the moddev plugin does when it creates the run tasks.
tasks.matching { it.name == 'runClient' }.configureEach { dependsOn 'applyClientOptions' }

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Optional client browser. Keep it separate from LSM's jar and dedicated servers.
    compileOnly "de.keksuccino:rinku-neoforge:${rinku_version}"
    localRuntime "de.keksuccino:rinku-neoforge:${rinku_version}"
    // Exact official Fusion 1.3.16-neoforge-mc26.2 release; installed in development runs.
    implementation "curse.maven:fusion-connected-textures-854949:${fusion_file_id}"
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
    // Optional Jade integration: resolve the official API without a local JAR.
    compileOnly "maven.modrinth:jade:${jade_version_id}"
}

// Optimize the resource graph before packaging or development runs. Source assets stay editable.
var optimizeModelResources = tasks.register('optimizeModelResources', Exec) {
    inputs.files(fileTree('src/main/resources') {
        include '**/*.json'
        exclude '**/.cache/**'
    }).withPropertyName('sourceModelResources').withPathSensitivity(PathSensitivity.RELATIVE)
    // Imported generators affect the prepared graph too, not only the entry script.
    inputs.files(fileTree('tools') {
        include '**/*.py', '**/*.json', '**/*.png', 'requirements.txt'
        exclude '**/check_*.py', '**/render_*.py', 'build/**'
    }).withPropertyName('resourcePreparationTools').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file('tools/module_layout.json').withPathSensitivity(PathSensitivity.RELATIVE)
    // An optional directory still fails validation when its configured path is missing.
    // A file tree is empty before datagen and tracks generated files when they exist.
    inputs.files(fileTree('src/generated/resources') {
        include '**/*.json'
        exclude '**/.cache/**'
    }).withPropertyName('generatedModelResources').withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.dir(layout.buildDirectory.dir('generated/optimizedModelGraph'))
    // Exec tasks otherwise ignore the build cache, even when global caching is enabled.
    outputs.cacheIf('Resource preparation has deterministic, relocatable output') { true }
    def pythonExecutable = providers.gradleProperty('pythonExecutable').getOrElse(
            System.getProperty('os.name').toLowerCase().contains('win') ? 'python' : 'python3')
    inputs.property('pythonExecutable', pythonExecutable)
    workingDir layout.projectDirectory.asFile
    commandLine pythonExecutable, '-X', 'utf8', 'tools/optimize_model_resources.py', '--json-only', '--timings', '--output',
            layout.buildDirectory.dir('generated/optimizedModelGraph').get().asFile.absolutePath
}

// Texture/audio edits only synchronize files; they do not rebuild the model graph.
var syncNonModelResources = tasks.register('syncNonModelResources', Sync) {
    from('src/main/resources') {
        exclude '**/*.json', '**/*.bbmodel', '**/.gitkeep', '**/.cache', '**/.cache/**'
        exclude(resourceModuleNames.collect { "${it}/**" })
    }
    resourceModuleNames.each { module ->
        from("src/main/resources/${module}") {
            exclude '**/*.json', '**/*.bbmodel', '**/.gitkeep', '**/.cache', '**/.cache/**'
        }
    }
    from('src/generated/resources') {
        exclude '**/*.json', '**/*.bbmodel', '**/.gitkeep', '**/.cache', '**/.cache/**'
    }
    into(layout.buildDirectory.dir('generated/nonModelResources'))
    duplicatesStrategy = DuplicatesStrategy.FAIL
}
tasks.named('processResources') { dependsOn optimizeModelResources, syncNonModelResources }

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Run geometry checks with the same Minecraft dependencies as the mod.
sourceSets {
    outlineCheck {
        java.srcDir 'tools/checks'
        compileClasspath = sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath = compileClasspath + output
    }
}
tasks.register('checkFurnitureOutlines', JavaExec) {
    dependsOn tasks.named('outlineCheckClasses')
    classpath = sourceSets.outlineCheck.runtimeClasspath
    mainClass = 'net.nicomar2009.lsmmod.block.SimpleBlockOutlineCheck'
    workingDir = layout.buildDirectory.get().asFile
    args projectDir.absolutePath
}
tasks.named('check') { dependsOn tasks.named('checkFurnitureOutlines') }
