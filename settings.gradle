pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Door contract plus Minecraft 26.2 compatibility: LSMcore e78829f342580c4b13bd38735a930bfda00ba8f5.
def coreDirectory = file(providers.gradleProperty('lsmcore_dir').getOrElse('../LSMcore'))
if (!new File(coreDirectory, 'settings.gradle').isFile()) {
    throw new GradleException('Clone https://github.com/LSM-Modding-Team/LSMcore beside LSMMod or set -Plsmcore_dir=...')
}
includeBuild(coreDirectory) {
    dependencySubstitution {
        substitute module('net.nicomar2009.lsmcore:lsmcore') using project(':')
    }
}

// Paint provider contract: PaintingMod commit 0c6ccb952e548384d0a0b0c9f12a9acf91d45221.
// Consume PaintingMod from source without publishing or copying dependency JARs.
def paintingModDirectory = file(providers.gradleProperty('paintingmod_dir').getOrElse('../PaintingMod'))
if (!new File(paintingModDirectory, 'settings.gradle').isFile()) {
    throw new GradleException("PaintingMod checkout not found at ${paintingModDirectory}. " +
            "Clone https://github.com/LSM-Modding-Team/PaintingMod beside this repository, " +
            "or set -Ppaintingmod_dir=/path/to/PaintingMod.")
}
includeBuild(paintingModDirectory) {
    dependencySubstitution {
        // The publication artifact ID differs from PaintingMod's root project name.
        substitute module('net.nicomar2009.paintingmod:paintingmod') using project(':')
    }
}
